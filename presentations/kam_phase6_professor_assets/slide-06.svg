  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">Current method and the research branches</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">06</tspan></text><rect x="610" y="315" width="380" height="205" rx="28" fill="#132238" stroke="none" stroke-width="0"/><text x="800" y="365" text-anchor="middle" fill="#D69E2E" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="1"><tspan x="800" dy="0">CURRENT CANDIDATE</tspan></text><text x="800" y="425" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="42" font-weight="760"><tspan x="800" dy="0">T-KAM-F</tspan></text><text x="800" y="472" text-anchor="middle" fill="#ECEFF3" font-family="DejaVu Sans" font-size="19" font-weight="500"><tspan x="800" dy="0">fixed / data-centered keys</tspan><tspan x="800" dy="28">sparse top-K · local experts · gate</tspan></text><rect x="70" y="200" width="410" height="150" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="70" y="200" width="8" height="150" rx="4" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="98" y="242" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="0.7"><tspan x="98" dy="0">LEARNED GEOMETRY</tspan></text><text x="98" y="278" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="98" dy="0">Can the support map improve</tspan><tspan x="98" dy="28">without becoming unstable?</tspan></text><rect x="70" y="580" width="410" height="150" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="70" y="580" width="8" height="150" rx="4" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="98" y="622" text-anchor="start" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="0.7"><tspan x="98" dy="0">ONLINE ADAPTATION</tspan></text><text x="98" y="658" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="98" dy="0">Can values or experts recover</tspan><tspan x="98" dy="28">quickly after regime change?</tspan></text><rect x="1120" y="200" width="410" height="150" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1120" y="200" width="8" height="150" rx="4" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="1148" y="242" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="0.7"><tspan x="1148" dy="0">ALTERNATING OPTIMIZATION</tspan></text><text x="1148" y="278" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="1148" dy="0">Fast algebra; conservative</tspan><tspan x="1148" dy="28">geometry updates.</tspan></text><rect x="1120" y="580" width="410" height="150" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1120" y="580" width="8" height="150" rx="4" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="1148" y="622" text-anchor="start" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="0.7"><tspan x="1148" dy="0">DUAL MEMORY</tspan></text><text x="1148" y="658" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="1148" dy="0">Slow persistent bank +</tspan><tspan x="1148" dy="28">small recent episodic bank.</tspan></text><rect x="595" y="615" width="410" height="150" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="595" y="615" width="8" height="150" rx="4" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="623" y="657" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="0.7"><tspan x="623" dy="0">EFFICIENT ROUTING</tspan></text><text x="623" y="693" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="623" dy="0">Exact, chunked, product-key</tspan><tspan x="623" dy="28">lookup at larger bank sizes.</tspan></text><line x1="480" y1="275" x2="610" y2="365" stroke="#D9DEE6" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="655" x2="610" y2="480" stroke="#D9DEE6" stroke-width="3" stroke-linecap="round"/><line x1="990" y1="365" x2="1120" y2="275" stroke="#D9DEE6" stroke-width="3" stroke-linecap="round"/><line x1="990" y1="480" x2="1120" y2="655" stroke="#D9DEE6" stroke-width="3" stroke-linecap="round"/><line x1="800" y1="520" x2="800" y2="615" stroke="#D9DEE6" stroke-width="3" stroke-linecap="round"/><rect x="285" y="805" width="1030" height="46" rx="16" fill="#F7E8BF" stroke="none" stroke-width="0"/><text x="800" y="836" text-anchor="middle" fill="#704F12" font-family="DejaVu Sans" font-size="20" font-weight="650"><tspan x="800" dy="0">Evidence is branch-specific: a fixed-key win cannot validate the other hypotheses.</tspan></text>
