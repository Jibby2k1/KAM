  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">What would count as convincing evidence?</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">07</tspan></text><rect x="70" y="205" width="335" height="205" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="98" y="285" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="54" font-weight="780"><tspan x="98" dy="0">156</tspan></text><text x="98" y="330" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="700"><tspan x="98" dy="0">fixed experiment rows</tspan></text><text x="98" y="372" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="98" dy="0">four NVIDIA L4 GPUs</tspan></text><rect x="435" y="205" width="335" height="205" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="463" y="285" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="54" font-weight="780"><tspan x="463" dy="0">30</tspan></text><text x="463" y="330" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="700"><tspan x="463" dy="0">primary paired seeds</tspan></text><text x="463" y="372" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="463" dy="0">TinyStories · KAM-F vs T-WIDE</tspan></text><rect x="800" y="205" width="335" height="205" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="828" y="285" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="54" font-weight="780"><tspan x="828" dy="0">24</tspan></text><text x="828" y="330" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="700"><tspan x="828" dy="0">replication pairs</tspan></text><text x="828" y="372" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="828" dy="0">Tiny Shakespeare</tspan></text><rect x="1165" y="205" width="335" height="205" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="1193" y="285" text-anchor="start" fill="#D69E2E" font-family="DejaVu Sans" font-size="54" font-weight="780"><tspan x="1193" dy="0">50M</tspan></text><text x="1193" y="330" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="700"><tspan x="1193" dy="0">training tokens / row</tspan></text><text x="1193" y="372" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="1193" dy="0">held-out endpoint</tspan></text><text x="70" y="485" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="25" font-weight="700"><tspan x="70" dy="0">A prespecified evidence gate</tspan></text><rect x="90" y="550" width="250" height="130" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="215" y="600" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="21" font-weight="760"><tspan x="215" dy="0">FAIR</tspan></text><text x="215" y="640" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="215" dy="0">same data + budget</tspan></text><line x1="350" y1="615" x2="385" y2="615" stroke="#132238" stroke-width="4" stroke-linecap="round"/><polygon points="385,615 373.7416697508023,621.5 373.7416697508023,608.5" fill="#132238"/><rect x="395" y="550" width="250" height="130" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="520" y="600" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="21" font-weight="760"><tspan x="520" dy="0">HELD-OUT</tspan></text><text x="520" y="640" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="520" dy="0">test endpoint</tspan></text><line x1="655" y1="615" x2="690" y2="615" stroke="#132238" stroke-width="4" stroke-linecap="round"/><polygon points="690,615 678.7416697508023,621.5 678.7416697508023,608.5" fill="#132238"/><rect x="700" y="550" width="250" height="130" rx="22" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="825" y="600" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="21" font-weight="760"><tspan x="825" dy="0">PAIRED</tspan></text><text x="825" y="640" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="825" dy="0">matched seeds</tspan></text><line x1="960" y1="615" x2="995" y2="615" stroke="#132238" stroke-width="4" stroke-linecap="round"/><polygon points="995,615 983.7416697508023,621.5 983.7416697508023,608.5" fill="#132238"/><rect x="1005" y="550" width="250" height="130" rx="22" fill="#2B6CB0" stroke="#1E4E82" stroke-width="2"/><text x="1130" y="600" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="21" font-weight="760"><tspan x="1130" dy="0">REPLICATED</tspan></text><text x="1130" y="640" text-anchor="middle" fill="#DCEAF7" font-family="DejaVu Sans" font-size="17" font-weight="500"><tspan x="1130" dy="0">second corpus</tspan></text><rect x="1270" y="550" width="260" height="130" rx="22" fill="#F7E8BF" stroke="none" stroke-width="0"/><text x="1400" y="597" text-anchor="middle" fill="#7A5713" font-family="DejaVu Sans" font-size="21" font-weight="760"><tspan x="1400" dy="0">2% MARGIN</tspan></text><text x="1400" y="635" text-anchor="middle" fill="#704F12" font-family="DejaVu Sans" font-size="16" font-weight="550"><tspan x="1400" dy="0">confidence interval must</tspan><tspan x="1400" dy="23">clear the threshold</tspan></text><rect x="175" y="735" width="1250" height="70" rx="18" fill="#132238" stroke="none" stroke-width="0"/><text x="800" y="780" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="23" font-weight="600"><tspan x="800" dy="0">Primary + replication must both pass  ·  no optional stopping  ·  no seed replacement</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>