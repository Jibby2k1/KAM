<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">The decision after confirmation</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">09</tspan></text><rect x="70" y="200" width="440" height="350" rx="28" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><circle cx="125" cy="255" r="28" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="125" y="263" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="17" font-weight="750"><tspan x="125" dy="0">01</tspan></text><text x="105" y="335" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="27" font-weight="760"><tspan x="105" dy="0">ROBUST FIXED-KEY</tspan><tspan x="105" dy="34">ADVANTAGE</tspan></text><line x1="105" y1="405" x2="475" y2="405" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="105" y="455" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="21" font-weight="550"><tspan x="105" dy="0">Accelerate T-KAM-F.</tspan><tspan x="105" dy="30">Scale memory banks and</tspan><tspan x="105" dy="30">test larger settings.</tspan></text><rect x="565" y="200" width="440" height="350" rx="28" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><circle cx="620" cy="255" r="28" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="620" y="263" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="17" font-weight="750"><tspan x="620" dy="0">02</tspan></text><text x="600" y="335" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="27" font-weight="760"><tspan x="600" dy="0">FIXED HELPS;</tspan><tspan x="600" dy="34">LEARNED FAILS</tspan></text><line x1="600" y1="405" x2="970" y2="405" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="600" y="455" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="21" font-weight="550"><tspan x="600" dy="0">Keep stable geometry.</tspan><tspan x="600" dy="30">Stop learned-memory</tspan><tspan x="600" dy="30">benefit claims.</tspan></text><rect x="1060" y="200" width="440" height="350" rx="28" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><circle cx="1115" cy="255" r="28" fill="#6B7280" stroke="none" stroke-width="0"/><text x="1115" y="263" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="17" font-weight="750"><tspan x="1115" dy="0">03</tspan></text><text x="1095" y="335" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="27" font-weight="760"><tspan x="1095" dy="0">NO REPLICATED</tspan><tspan x="1095" dy="34">QUALITY EDGE</tspan></text><line x1="1095" y1="405" x2="1465" y2="405" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="1095" y="455" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="21" font-weight="550"><tspan x="1095" dy="0">Reject the general claim.</tspan><tspan x="1095" dy="30">Retain only supported</tspan><tspan x="1095" dy="30">niches or diagnostics.</tspan></text><text x="70" y="620" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="25" font-weight="700"><tspan x="70" dy="0">Questions for discussion</tspan></text><circle cx="91" cy="664" r="8" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="115" y="670" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="21" font-weight="550"><tspan x="115" dy="0">Is a 2% loss improvement the right scientific threshold?</tspan></text><circle cx="91" cy="716" r="8" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="115" y="722" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="21" font-weight="550"><tspan x="115" dy="0">Should scale-up optimize quality, active compute, or adaptation speed?</tspan></text><circle cx="91" cy="768" r="8" fill="#6B7280" stroke="none" stroke-width="0"/><text x="115" y="774" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="21" font-weight="550"><tspan x="115" dy="0">Which failure mode would be most informative for the broader direction?</tspan></text><rect x="775" y="630" width="755" height="170" rx="24" fill="#132238" stroke="none" stroke-width="0"/><text x="1152" y="690" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="31" font-weight="650"><tspan x="1152" dy="0">The goal is a narrow,</tspan><tspan x="1152" dy="40">testable claim—</tspan></text><text x="1152" y="773" text-anchor="middle" fill="#D69E2E" font-family="DejaVu Sans" font-size="21" font-weight="650"><tspan x="1152" dy="0">not a universal memory architecture claim.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>