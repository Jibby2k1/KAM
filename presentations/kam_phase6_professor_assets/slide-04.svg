  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">MINIMAL FORMAL VIEW</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">One technical slide: sparse separable KAM</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">04</tspan></text><rect x="70" y="190" width="690" height="520" rx="28" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="105" y="240" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1.2"><tspan x="105" dy="0">THREE LINES OF NOTATION</tspan></text><circle cx="125" cy="306" r="22" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3"/><text x="125" y="314" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="125" dy="0">1</tspan></text><text x="170" y="314" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="23" font-weight="600"><tspan x="170" dy="0">I(z) = TopK(similarity(z, keys))</tspan></text><line x1="110" y1="362" x2="710" y2="362" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><circle cx="125" cy="426" r="22" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3"/><text x="125" y="434" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="125" dy="0">2</tspan></text><text x="170" y="434" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="21" font-weight="600"><tspan x="170" dy="0">memory(u) = Σ selected weight × local expert(u)</tspan></text><line x1="110" y1="482" x2="710" y2="482" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><circle cx="125" cy="546" r="22" fill="#D69E2E" stroke="#FFFFFF" stroke-width="3"/><text x="125" y="554" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="125" dy="0">3</tspan></text><text x="170" y="554" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="23" font-weight="600"><tspan x="170" dy="0">output = Transformer path + small FFN + gate × memory</tspan></text><rect x="800" y="190" width="730" height="520" rx="28" fill="#DCEAF7" stroke="#2B6CB0" stroke-width="3"/><text x="835" y="240" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1.2"><tspan x="835" dy="0">WHY “SEPARABLE”?</tspan></text><rect x="850" y="300" width="245" height="145" rx="20" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="972" y="345" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="972" dy="0">GEOMETRY</tspan></text><text x="972" y="390" text-anchor="middle" fill="#132238" font-family="DejaVu Sans" font-size="23" font-weight="650"><tspan x="972" dy="0">Where should</tspan><tspan x="972" dy="30">the model look?</tspan></text><rect x="1235" y="300" width="245" height="145" rx="20" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1357" y="345" text-anchor="middle" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="1357" dy="0">ALGEBRA</tspan></text><text x="1357" y="390" text-anchor="middle" fill="#132238" font-family="DejaVu Sans" font-size="23" font-weight="650"><tspan x="1357" dy="0">What should it</tspan><tspan x="1357" dy="30">return there?</tspan></text><line x1="1110" y1="372" x2="1218" y2="372" stroke="#132238" stroke-width="4" stroke-linecap="round"/><polygon points="1218,372 1206.7416697508022,378.5 1206.7416697508022,365.5" fill="#132238"/><text x="1164" y="520" text-anchor="middle" fill="#132238" font-family="DejaVu Sans" font-size="31" font-weight="720"><tspan x="1164" dy="0">Different objects</tspan><tspan x="1164" dy="40">can learn on</tspan><tspan x="1164" dy="40">different timescales.</tspan></text><rect x="70" y="745" width="1460" height="72" rx="18" fill="#132238" stroke="none" stroke-width="0"/><text x="105" y="790" text-anchor="start" fill="#D69E2E" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1"><tspan x="105" dy="0">FAIRNESS</tspan></text><text x="255" y="790" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="255" dy="0">Same data + token budget  ·  matched total parameters  ·  active parameters/FLOPs reported  ·  strong controls</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
