<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">Two timescales: learn the map, then stabilize it</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">05</tspan></text><text x="110" y="205" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700" letter-spacing="1.2"><tspan x="110" dy="0">TRAINING PROGRESS</tspan></text><line x1="110" y1="315" x2="1450" y2="315" stroke="#D9DEE6" stroke-width="8" stroke-linecap="round"/><circle cx="150" cy="315" r="18" fill="#2B6CB0" stroke="#F7F5EF" stroke-width="5"/><text x="150" y="365" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="19" font-weight="750"><tspan x="150" dy="0">ADAPT</tspan></text><text x="150" y="397" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="500"><tspan x="150" dy="0">keys + experts learn</tspan></text><circle cx="475" cy="315" r="18" fill="#2B6CB0" stroke="#F7F5EF" stroke-width="5"/><text x="475" y="365" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="19" font-weight="750"><tspan x="475" dy="0">STABILIZE</tspan></text><text x="475" y="397" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="500"><tspan x="475" dy="0">geometry slows</tspan></text><circle cx="1182" cy="315" r="18" fill="#D69E2E" stroke="#F7F5EF" stroke-width="5"/><text x="1182" y="365" text-anchor="middle" fill="#7A5713" font-family="DejaVu Sans" font-size="19" font-weight="750"><tspan x="1182" dy="0">FREEZE</tspan></text><text x="1182" y="397" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="500"><tspan x="1182" dy="0">≈ 80% of tokens</tspan></text><circle cx="1310" cy="315" r="18" fill="#2B6CB0" stroke="#F7F5EF" stroke-width="5"/><text x="1310" y="365" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="19" font-weight="750"><tspan x="1310" dy="0">FINAL TUNE</tspan></text><text x="1310" y="397" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="500"><tspan x="1310" dy="0">stable routing</tspan></text><line x1="1182" y1="245" x2="1182" y2="680" stroke="#D69E2E" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/><rect x="1112" y="220" width="140" height="38" rx="19" fill="#F7E8BF" stroke="none" stroke-width="0"/><text x="1182" y="246" text-anchor="middle" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="700" letter-spacing="0.5"><tspan x="1182" dy="0">LOCKED MAP</tspan></text><text x="115" y="480" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1"><tspan x="115" dy="0">GEOMETRY</tspan></text><path d="M 265 515 C 430 430, 650 475, 820 500 S 1040 512, 1182 512 L 1460 512" fill="none" stroke="#2B6CB0" stroke-width="7" stroke-linecap="round"/><text x="1470" y="520" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="16" font-weight="650"><tspan x="1470" dy="0">frozen</tspan></text><text x="115" y="610" text-anchor="start" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1"><tspan x="115" dy="0">ALGEBRA</tspan></text><path d="M 265 645 C 430 555, 635 590, 800 615 S 1080 600, 1230 625 S 1400 590, 1460 605" fill="none" stroke="#D69E2E" stroke-width="7" stroke-linecap="round"/><rect x="1010" y="705" width="455" height="90" rx="18" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="1035" y="740" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="700"><tspan x="1035" dy="0">Library analogy</tspan></text><text x="1035" y="773" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="600"><tspan x="1035" dy="0">shelving stabilizes; contents keep improving</tspan></text><rect x="105" y="705" width="820" height="90" rx="18" fill="#132238" stroke="none" stroke-width="0"/><text x="135" y="742" text-anchor="start" fill="#D69E2E" font-family="DejaVu Sans" font-size="17" font-weight="750"><tspan x="135" dy="0">Lifecycle test</tspan></text><text x="135" y="775" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="22" font-weight="600"><tspan x="135" dy="0">pre-freeze learning + post-freeze drift ≤ 1e-10</tspan></text><text x="70" y="853" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="400"><tspan x="70" dy="0">Fixed-key success does not prove that learned geometry helps.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>