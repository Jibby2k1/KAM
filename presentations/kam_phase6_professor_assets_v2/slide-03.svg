e-width="3"/><text x="490" y="381" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="14" font-weight="650"><tspan x="490" dy="0">k4</tspan></text><circle cx="565" cy="520" r="18" fill="#2B6CB0" stroke="#1E4E82" stroke-width="3"/><text x="565" y="496" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="14" font-weight="650"><tspan x="565" dy="0">k5</tspan></text><circle cx="690" cy="350" r="12" fill="#ECEFF3" stroke="#D9DEE6" stroke-width="1.5"/><text x="690" y="326" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="14" font-weight="650"><tspan x="690" dy="0">k6</tspan></text><circle cx="655" cy="650" r="12" fill="#ECEFF3" stroke="#D9DEE6" stroke-width="1.5"/><text x="655" y="626" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="14" font-weight="650"><tspan x="655" dy="0">k7</tspan></text><circle cx="300" cy="690" r="12" fill="#ECEFF3" stroke="#D9DEE6" stroke-width="1.5"/><text x="300" y="666" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="14" font-weight="650"><tspan x="300" dy="0">k8</tspan></text><circle cx="735" cy="555" r="12" fill="#ECEFF3" stroke="#D9DEE6" stroke-width="1.5"/><text x="735" y="531" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="14" font-weight="650"><tspan x="735" dy="0">k9</tspan></text><circle cx="430" cy="470" r="25" fill="#D69E2E" stroke="#FFFFFF" stroke-width="4"/><text x="430" y="478" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="21" font-weight="750" font-style="italic"><tspan x="430" dy="0">z</tspan></text><text x="430" y="735" text-anchor="middle" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="550"><tspan x="430" dy="0">D shapes the contours · τ controls sharpness · Top-K selects support</tspan></text><rect x="870" y="190" width="660" height="145" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="870" y="190" width="7" height="145" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="898" y="232" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="22" font-weight="600"><tspan x="898" dy="0">s_i(z) = -(1 / 2τ)</tspan><tspan x="898" dy="32">         (z - k_i)ᵀ D (z - k_i)</tspan></text><rect x="870" y="370" width="660" height="115" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="870" y="370" width="7" height="115" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="898" y="412" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="25" font-weight="600"><tspan x="898" dy="0">I(z) = TopK_i  s_i(z)</tspan></text><rect x="870" y="520" width="660" height="160" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="870" y="520" width="7" height="160" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="898" y="562" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="21" font-weight="600"><tspan x="898" dy="0">a_i(z) = exp(s_i)</tspan><tspan x="898" dy="30">         ─────────────</tspan><tspan x="898" dy="30">         Σ_{j∈I(z)} exp(s_j)</tspan></text><text x="900" y="730" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="550"><tspan x="900" dy="0">The visual neighborhood is the metric defined by D—not a metaphorical cluster.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
