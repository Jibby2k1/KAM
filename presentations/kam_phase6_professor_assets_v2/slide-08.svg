xt><rect x="905" y="270" width="215" height="38" rx="19" fill="#F7E8BF" stroke="none" stroke-width="0"/><text x="1012.5" y="296" text-anchor="middle" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="700" letter-spacing="0.5"><tspan x="1012.5" dy="0">DIRECTIONAL ONLY</tspan></text><text x="905" y="340" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="20" font-weight="560"><tspan x="905" dy="0">exact paired permutation p = 0.25</tspan><tspan x="905" dy="31">Holm-adjusted p = 0.75</tspan><tspan x="905" dy="31"></tspan><tspan x="905" dy="31">The magnitude motivates confirmation;</tspan><tspan x="905" dy="31">the information is insufficient for a claim.</tspan></text><line x1="905" y1="520" x2="1485" y2="520" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="905" y="565" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="750" letter-spacing="0.7"><tspan x="905" dy="0">CONFIRMATION STATUS · JUL 28, 6:40 PM EDT</tspan></text><text x="905" y="627" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="35" font-weight="780"><tspan x="905" dy="0">43 / 156 complete</tspan></text><text x="905" y="670" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="20" font-weight="650"><tspan x="905" dy="0">4 running · 109 pending · 0 failures</tspan></text><text x="905" y="714" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="550"><tspan x="905" dy="0">Partial scientific effects remain uninspected.</tspan></text><rect x="270" y="790" width="1060" height="55" rx="15" fill="#132238" stroke="none" stroke-width="0"/><text x="800" y="826" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="23" font-weight="650"><tspan x="800" dy="0">Promising enough to confirm; not strong enough to conclude.</tspan></text>
