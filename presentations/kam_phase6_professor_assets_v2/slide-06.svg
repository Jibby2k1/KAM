<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">Each research branch is a different mathematical intervention</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">06</tspan></text><rect x="70" y="185" width="455" height="175" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="70" y="185" width="7" height="175" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="96" y="223" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="0.6"><tspan x="96" dy="0">T-KAM-F · FIXED GEOMETRY</tspan></text><text x="96" y="263" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="18" font-weight="600"><tspan x="96" dy="0">k_i ← data center_i</tspan></text><text x="96" y="304" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="520"><tspan x="96" dy="0">Is useful geometry available</tspan><tspan x="96" dy="24">without learning keys?</tspan></text><rect x="572" y="185" width="455" height="175" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="572" y="185" width="7" height="175" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="598" y="223" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="0.6"><tspan x="598" dy="0">T-KAM-L · LEARNED GEOMETRY</tspan></text><text x="598" y="263" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="18" font-weight="600"><tspan x="598" dy="0">k_i = k_i⁰ + Δk_i</tspan></text><text x="598" y="304" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="520"><tspan x="598" dy="0">Does support placement improve</tspan><tspan x="598" dy="24">without instability?</tspan></text><rect x="1074" y="185" width="455" height="175" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1074" y="185" width="7" height="175" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="1100" y="223" text-anchor="start" fill="#7A5713" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="0.6"><tspan x="1100" dy="0">T-KAM-ALT · ALTERNATING</tspan></text><text x="1100" y="263" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="18" font-weight="600"><tspan x="1100" dy="0">θ_A step ↔ θ_G step</tspan></text><text x="1100" y="304" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="520"><tspan x="1100" dy="0">Does timescale separation</tspan><tspan x="1100" dy="24">improve optimization?</tspan></text><rect x="70" y="405" width="455" height="175" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="70" y="405" width="7" height="175" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="96" y="443" text-anchor="start" fill="#7A5713" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="0.6"><tspan x="96" dy="0">ONLINE ALGEBRA</tspan></text><text x="96" y="483" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="18" font-weight="600"><tspan x="96" dy="0">θ_{A,t+1}=θ_{A,t}-η_on∇ℓ_t</tspan></text><text x="96" y="524" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="520"><tspan x="96" dy="0">Can local experts recover</tspan><tspan x="96" dy="24">quickly after a shift?</tspan></text><rect x="572" y="405" width="455" height="175" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="572" y="405" width="7" height="175" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="598" y="443" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="0.6"><tspan x="598" dy="0">DUAL MEMORY</tspan></text><text x="598" y="483" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="18" font-weight="600"><tspan x="598" dy="0">m_t=g_t m_tᴳ+(1-g_t)m_tᴱ</tspan></text><text x="598" y="524" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="520"><tspan x="598" dy="0">Do persistent and recent</tspan><tspan x="598" dy="24">memory complement each other?</tspan></text><rect x="1074" y="405" width="455" height="175" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1074" y="405" width="7" height="175" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="1100" y="443" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="750" letter-spacing="0.6"><tspan x="1100" dy="0">PRODUCT-KEY ROUTING</tspan></text><text x="1100" y="483" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="18" font-weight="600"><tspan x="1100" dy="0">k_{pq}=k_p¹ ⊕ k_q²</tspan></text><text x="1100" y="524" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="17" font-weight="520"><tspan x="1100" dy="0">Can retrieval scale without</tspan><tspan x="1100" dy="24">exact search?</tspan></text><rect x="220" y="670" width="1160" height="92" rx="20" fill="#132238" stroke="none" stroke-width="0"/><text x="800" y="710" text-anchor="middle" fill="#D69E2E" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1"><tspan x="800" dy="0">Evidence boundary</tspan></text><text x="800" y="746" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="23" font-weight="600"><tspan x="800" dy="0">A result for one intervention cannot validate another intervention.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>