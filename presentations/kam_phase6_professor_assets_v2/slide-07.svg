<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">Confirmation is a paired test of a prespecified estimand</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">07</tspan></text><rect x="70" y="185" width="220" height="130" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="92" y="242" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="39" font-weight="780"><tspan x="92" dy="0">156</tspan></text><text x="92" y="282" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="17" font-weight="650"><tspan x="92" dy="0">fixed rows</tspan></text><rect x="325" y="185" width="220" height="130" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="347" y="242" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="39" font-weight="780"><tspan x="347" dy="0">30</tspan></text><text x="347" y="282" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="17" font-weight="650"><tspan x="347" dy="0">primary pairs</tspan></text><rect x="580" y="185" width="220" height="130" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="602" y="242" text-anchor="start" fill="#2B6CB0" font-family="DejaVu Sans" font-size="39" font-weight="780"><tspan x="602" dy="0">24</tspan></text><text x="602" y="282" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="17" font-weight="650"><tspan x="602" dy="0">replication pairs</tspan></text><rect x="835" y="185" width="220" height="130" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="857" y="242" text-anchor="start" fill="#D69E2E" font-family="DejaVu Sans" font-size="39" font-weight="780"><tspan x="857" dy="0">50M</tspan></text><text x="857" y="282" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="17" font-weight="650"><tspan x="857" dy="0">tokens / row</tspan></text><rect x="1100" y="185" width="430" height="130" rx="20" fill="#DCEAF7" stroke="none" stroke-width="0"/><text x="1315" y="232" text-anchor="middle" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="1315" dy="0">PRIMARY + REPLICATION</tspan></text><text x="1315" y="275" text-anchor="middle" fill="#132238" font-family="DejaVu Sans" font-size="27" font-weight="700"><tspan x="1315" dy="0">both must pass</tspan></text><rect x="70" y="365" width="715" height="145" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="70" y="365" width="7" height="145" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="98" y="407" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="24" font-weight="600"><tspan x="98" dy="0">δ_s = log( L_KAM-F,s / L_T-WIDE,s )</tspan></text><text x="95" y="550" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="20" font-weight="540"><tspan x="95" dy="0">Pairing removes seed-level nuisance variation:</tspan><tspan x="95" dy="30">each architecture sees the same training and data-order seed.</tspan></text><rect x="825" y="365" width="705" height="190" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="825" y="365" width="7" height="190" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="853" y="407" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="21" font-weight="600"><tspan x="853" dy="0">p_sign-flip ≤ 0.05</tspan><tspan x="853" dy="30">        AND</tspan><tspan x="853" dy="30">CI₉₅%, upper( mean δ ) ≤ log(0.98)</tspan></text><rect x="825" y="590" width="705" height="145" rx="20" fill="#132238" stroke="none" stroke-width="0"/><text x="855" y="632" text-anchor="start" fill="#D69E2E" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="855" dy="0">Promotion rule</tspan></text><text x="855" y="682" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans Mono" font-size="27" font-weight="650"><tspan x="855" dy="0">PrimaryPass ∧ ReplicationPass</tspan></text><rect x="70" y="650" width="715" height="85" rx="18" fill="#F7E8BF" stroke="none" stroke-width="0"/><text x="95" y="686" text-anchor="start" fill="#704F12" font-family="DejaVu Sans" font-size="20" font-weight="650"><tspan x="95" dy="0">The interval must clear a 2% improvement—</tspan></text><text x="95" y="716" text-anchor="start" fill="#704F12" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="95" dy="0">not merely exclude zero.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>