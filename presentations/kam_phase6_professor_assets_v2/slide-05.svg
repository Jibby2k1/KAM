5" dy="0">algebra continues</tspan></text><text x="315" y="315" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="315" dy="0">geometry / keys</tspan></text><text x="320" y="430" text-anchor="start" fill="#7A5713" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="320" dy="0">algebra / experts</tspan></text><rect x="1010" y="190" width="520" height="185" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1010" y="190" width="7" height="185" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="1038" y="232" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="20" font-weight="600"><tspan x="1038" dy="0">θ_A ← θ_A - η_A ∇_{θ_A} L</tspan><tspan x="1038" dy="29">θ_G ← θ_G - η_G ∇_{θ_G} L</tspan><tspan x="1038" dy="29"></tspan><tspan x="1038" dy="29">η_G ≪ η_A</tspan></text><rect x="1010" y="410" width="520" height="135" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1010" y="410" width="7" height="135" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="1038" y="452" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="23" font-weight="600"><tspan x="1038" dy="0">η_G(t) = 0,   t ≥ 0.8T</tspan></text><rect x="1010" y="580" width="520" height="135" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="1010" y="580" width="7" height="135" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="1038" y="622" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="21" font-weight="600"><tspan x="1038" dy="0">|| K_T - K_{0.8T} ||₂ ≤ 10⁻¹⁰</tspan></text><rect x="170" y="735" width="1160" height="68" rx="18" fill="#132238" stroke="none" stroke-width="0"/><text x="750" y="778" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="24" font-weight="650"><tspan x="750" dy="0">Learn the map → stabilize it → freeze it → tune against stable routing</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
