<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">Retrieval is a local model, then a gated residual</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">04</tspan></text><rect x="70" y="185" width="805" height="580" rx="28" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><text x="105" y="230" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="750" letter-spacing="1.1"><tspan x="105" dy="0">SELECTED LOCAL EXPERTS</tspan></text><circle cx="145" cy="315" r="24" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3"/><text x="145" y="322" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="700"><tspan x="145" dy="0">k1</tspan></text><line x1="180" y1="315" x2="270" y2="315" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/><polygon points="270,315 258.7416697508023,321.5 258.7416697508023,308.5" fill="#2B6CB0"/><rect x="285" y="272" width="255" height="86" rx="16" fill="#DCEAF7" stroke="#D9DEE6" stroke-width="2"/><text x="412" y="310" text-anchor="middle" fill="#132238" font-family="DejaVu Sans Mono" font-size="20" font-weight="650"><tspan x="412" dy="0">g1(u) = A1u + b1</tspan></text><text x="575" y="322" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="575" dy="0">a₁ = .52</tspan></text><line x1="650" y1="315" x2="720" y2="445" stroke="#2B6CB0" stroke-width="4" stroke-linecap="round"/><circle cx="145" cy="445" r="24" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3"/><text x="145" y="452" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="700"><tspan x="145" dy="0">k2</tspan></text><line x1="180" y1="445" x2="270" y2="445" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/><polygon points="270,445 258.7416697508023,451.5 258.7416697508023,438.5" fill="#2B6CB0"/><rect x="285" y="402" width="255" height="86" rx="16" fill="#ECEFF3" stroke="#D9DEE6" stroke-width="2"/><text x="412" y="440" text-anchor="middle" fill="#132238" font-family="DejaVu Sans Mono" font-size="20" font-weight="650"><tspan x="412" dy="0">g2(u) = A2u + b2</tspan></text><text x="575" y="452" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="575" dy="0">a₂ = .31</tspan></text><line x1="650" y1="445" x2="720" y2="445" stroke="#98A1AE" stroke-width="4" stroke-linecap="round"/><circle cx="145" cy="575" r="24" fill="#2B6CB0" stroke="#FFFFFF" stroke-width="3"/><text x="145" y="582" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="15" font-weight="700"><tspan x="145" dy="0">k3</tspan></text><line x1="180" y1="575" x2="270" y2="575" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/><polygon points="270,575 258.7416697508023,581.5 258.7416697508023,568.5" fill="#2B6CB0"/><rect x="285" y="532" width="255" height="86" rx="16" fill="#ECEFF3" stroke="#D9DEE6" stroke-width="2"/><text x="412" y="570" text-anchor="middle" fill="#132238" font-family="DejaVu Sans Mono" font-size="20" font-weight="650"><tspan x="412" dy="0">g3(u) = A3u + b3</tspan></text><text x="575" y="582" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="575" dy="0">a₃ = .17</tspan></text><line x1="650" y1="575" x2="720" y2="445" stroke="#98A1AE" stroke-width="4" stroke-linecap="round"/><circle cx="735" cy="445" r="34" fill="#D69E2E" stroke="#FFFFFF" stroke-width="4"/><text x="735" y="454" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="28" font-weight="750"><tspan x="735" dy="0">Σ</tspan></text><line x1="770" y1="445" x2="835" y2="445" stroke="#132238" stroke-width="4" stroke-linecap="round"/><polygon points="835,445 823.7416697508023,451.5 823.7416697508023,438.5" fill="#132238"/><text x="820" y="420" text-anchor="middle" fill="#132238" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="820" dy="0">m(u)</tspan></text><rect x="915" y="190" width="615" height="150" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="915" y="190" width="7" height="150" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="943" y="232" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="21" font-weight="600"><tspan x="943" dy="0">g_i(u) = A_i u + b_i</tspan><tspan x="943" dy="30"></tspan><tspan x="943" dy="30">m(u) = Σ_{i∈I(z)} a_i(z) g_i(u)</tspan></text><rect x="915" y="380" width="615" height="150" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="915" y="380" width="7" height="150" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="943" y="422" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="23" font-weight="600"><tspan x="943" dy="0">h⁺ = h_base⁺ + γ(u) W_o m(u)</tspan></text><rect x="915" y="570" width="615" height="195" rx="22" fill="#132238" stroke="none" stroke-width="0"/><text x="945" y="615" text-anchor="start" fill="#D69E2E" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="945" dy="0">What each term means</tspan></text><text x="945" y="655" text-anchor="start" fill="#FFFFFF" font-family="DejaVu Sans" font-size="20" font-weight="550"><tspan x="945" dy="0">I(z): selected neighborhood</tspan><tspan x="945" dy="31">A_i, b_i: local algebra</tspan><tspan x="945" dy="31">γ(u): learned permission to use memory</tspan></text><text x="70" y="853" text-anchor="start" fill="#6B7280" font-family="DejaVu Sans" font-size="16" font-weight="400"><tspan x="70" dy="0">The gate begins near zero, so the architecture begins close to its baseline.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>