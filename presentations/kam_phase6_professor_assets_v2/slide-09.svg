<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" rx="0" fill="#F7F5EF" stroke="none" stroke-width="0"/>
  <text x="70" y="54" text-anchor="start" fill="#1E4E82" font-family="DejaVu Sans" font-size="17" font-weight="700" letter-spacing="1.6"><tspan x="70" dy="0">KAM · PHASE VI</tspan></text><text x="70" y="112" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="42" font-weight="700"><tspan x="70" dy="0">The decision decomposes into performance and mechanism gates</tspan></text><line x1="70" y1="142" x2="1530" y2="142" stroke="#D9DEE6" stroke-width="2" stroke-linecap="round"/><text x="1530" y="54" text-anchor="end" fill="#6B7280" font-family="DejaVu Sans" font-size="18" font-weight="700"><tspan x="1530" dy="0">09</tspan></text><rect x="70" y="185" width="710" height="125" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="70" y="185" width="7" height="125" rx="3" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="98" y="227" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="21" font-weight="600"><tspan x="98" dy="0">AccelerateFixed = PrimaryPass ∧ ReplicationPass</tspan></text><rect x="820" y="185" width="710" height="125" rx="20" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><rect x="820" y="185" width="7" height="125" rx="3" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="848" y="227" text-anchor="start" fill="#132238" font-family="DejaVu Sans Mono" font-size="19" font-weight="600"><tspan x="848" dy="0">ClaimLearned = AccelerateFixed ∧ LifecyclePass</tspan><tspan x="848" dy="28">               ∧ LearnedVsFixedPass</tspan></text><rect x="70" y="360" width="440" height="235" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><circle cx="112" cy="405" r="18" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="145" y="412" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="145" dy="0">FIXED KAM PASSES</tspan></text><line x1="98" y1="448" x2="482" y2="448" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="98" y="492" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="19" font-weight="550"><tspan x="98" dy="0">Accelerate fixed / data-centered geometry.</tspan><tspan x="98" dy="30">Scale banks and language settings.</tspan></text><rect x="565" y="360" width="440" height="235" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><circle cx="607" cy="405" r="18" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="640" y="412" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="17" font-weight="750"><tspan x="640" dy="0">FIXED PASSES; LEARNED FAILS</tspan></text><line x1="593" y1="448" x2="977" y2="448" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="593" y="492" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="19" font-weight="550"><tspan x="593" dy="0">Retain stable geometry.</tspan><tspan x="593" dy="30">Reject learned-memory claims.</tspan></text><rect x="1060" y="360" width="440" height="235" rx="24" fill="#FFFFFF" stroke="#D9DEE6" stroke-width="2"/><circle cx="1102" cy="405" r="18" fill="#6B7280" stroke="none" stroke-width="0"/><text x="1135" y="412" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="18" font-weight="750"><tspan x="1135" dy="0">PRIMARY OR REPLICATION FAILS</tspan></text><line x1="1088" y1="448" x2="1472" y2="448" stroke="#ECEFF3" stroke-width="2" stroke-linecap="round"/><text x="1088" y="492" text-anchor="start" fill="#334155" font-family="DejaVu Sans" font-size="19" font-weight="550"><tspan x="1088" dy="0">Reject a general quality advantage.</tspan><tspan x="1088" dy="30">Test only separately supported niches.</tspan></text><text x="70" y="660" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="24" font-weight="700"><tspan x="70" dy="0">Questions for discussion</tspan></text><circle cx="90" cy="704" r="7" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="112" y="710" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="19" font-weight="550"><tspan x="112" dy="0">Is 2% the right scientific margin?</tspan></text><circle cx="90" cy="747" r="7" fill="#D69E2E" stroke="none" stroke-width="0"/><text x="112" y="753" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="19" font-weight="550"><tspan x="112" dy="0">Should scale-up optimize quality, active compute, or adaptation speed?</tspan></text><circle cx="90" cy="790" r="7" fill="#6B7280" stroke="none" stroke-width="0"/><text x="112" y="796" text-anchor="start" fill="#132238" font-family="DejaVu Sans" font-size="19" font-weight="550"><tspan x="112" dy="0">Which mechanism result would most change the direction?</tspan></text><rect x="880" y="650" width="650" height="155" rx="22" fill="#132238" stroke="none" stroke-width="0"/><text x="1205" y="704" text-anchor="middle" fill="#FFFFFF" font-family="DejaVu Sans" font-size="27" font-weight="650"><tspan x="1205" dy="0">Narrow claim, explicit gate,</tspan></text><text x="1205" y="747" text-anchor="middle" fill="#D69E2E" font-family="DejaVu Sans" font-size="27" font-weight="650"><tspan x="1205" dy="0">mechanism-specific evidence.</tspan></text><text x="1530" y="853" text-anchor="end" fill="#98A1AE" font-family="DejaVu Sans" font-size="15" font-weight="500"><tspan x="1530" dy="0">Sparse Separable Memory</tspan></text>
</svg>