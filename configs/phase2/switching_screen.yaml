  - {run_id: swmg_RR_s7, task: switching_mackey_glass, variant: RR, seed: 7, schedule: [A, B, A], series_length: 4000, seq_len: 32, batch_size: 32, d_model: 48, num_heads: 4, num_layers: 1, num_supports: 32, steps: 500}
