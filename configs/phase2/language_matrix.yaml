suite_name: phase2_language_matrix
device: cuda
precision: amp
seed: 7
output_root: results/phase2/language_matrix
study_database: results/phase2/language_matrix/study.sqlite
metrics_table: results/phase2/language_matrix/all_metrics.csv
fail_fast: false
