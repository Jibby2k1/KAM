suite_name: phase2_cpu_smoke
device: cpu
precision: fp32
seed: 7
output_root: results/phase2/cpu_smoke
study_database: results/phase2/cpu_smoke/study.sqlite
metrics_table: results/phase2/cpu_smoke/all_metrics.csv
fail_fast: true
runs:
  - {run_id: mqar_D0, task: mqar, variant: D0, sequence_length: 32, bindings: 4, queries: 2, vocab_size: 64, train_size: 32, val_size: 16, batch_size: 8, d_model: 24, num_heads: 4, num_layers: 1, num_supports: 8, steps: 3}
  - {run_id: mqar_DR, task: mqar, variant: DR, memory_mode: both, sequence_length: 32, bindings: 4, queries: 2, vocab_size: 64, train_size: 32, val_size: 16, batch_size: 8, d_model: 24, num_heads: 4, num_layers: 1, num_supports: 8, steps: 3}
  - {run_id: dyck2_DR, task: dyck2, variant: DR, memory_mode: routes, max_depth: 8, train_size: 32, val_size: 16, batch_size: 8, d_model: 24, num_heads: 4, num_layers: 1, num_supports: 8, steps: 3}
  - {run_id: mackey_DD, task: mackey_glass, variant: DD, memory_mode: values, series_length: 1200, seq_len: 16, train_size: 32, val_size: 16, batch_size: 8, d_model: 24, num_heads: 4, num_layers: 1, num_supports: 8, steps: 3}
  - {run_id: narma_DR, task: narma, variant: DR, memory_mode: both, order: 10, series_length: 1200, seq_len: 16, batch_size: 8, d_model: 24, num_heads: 4, num_layers: 1, num_supports: 8, steps: 3}
