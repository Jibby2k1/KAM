suite_name: phase2_search_smoke
device: cuda
precision: amp
output_root: results/phase2/search_smoke
search_database: results/phase2/search_smoke/optuna.sqlite
search_tasks: [switching_mackey_glass, switching_narma]
search_schedule: [A, B, A]
search_series_length: 1200
search_seq_len: 16
search_batch_size: 16
search_steps: 30
search:
  trials_per_family_task: 2
  families: [D0, DR]
  space:
    d_model: [24, 48]
    num_layers: [1]
    num_heads: [4]
    num_supports: [8, 16]
    context_window: [16, full]
    ffn_expansion: [2, 4]
    learning_rate: {type: log_float, low: 0.0003, high: 0.001}
    weight_decay: {type: log_float, low: 0.000001, high: 0.0001}
    dropout: [0.0]
    bandwidth_init: [0.5, 1.0]
    bandwidth_learned: [false, true]
    route_projection_dim: [null]
