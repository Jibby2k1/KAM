name: CPU smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_attention.py tests/test_data.py tests/test_model.py
      - name: Recompute HotpotQA results
        run: |
          study=results/nonlinear_retrieval_natural/support_link_v1
          python scripts/analyze_kam_fullwiki_support_links.py "$study" --output /tmp/kam-summary.json
          diff -u "$study/summary.json" /tmp/kam-summary.json
      - name: Replay dataset and model metrics
        run: |
          archive=results/nonlinear_retrieval_natural
          output=$(mktemp -d)
          for pair in corrections:bitemporal_corrections_v1 curriculum:bitemporal_curriculum_v1 \
                      archive_projection:bitemporal_archive_v1 archive_topology:bitemporal_archive_topology_v1 \
                      archive_factors:bitemporal_archive_factors_v1 vintage_stream:vintage_stream_v1 \
                      timelineqa:timelineqa_v1 unseentimeqa_probe:unseentimeqa_probe_v1; do
            analysis=${pair%%:*}
            study="$archive/${pair#*:}"
            python scripts/analyze_kam_breadth_followups.py "$analysis" "$study" --output "$output/$analysis.json"
            diff -u "$study/summary.json" "$output/$analysis.json"
          done
      - name: Replay archive and coverage-gate follow-up
        run: |
          archive=results/nonlinear_retrieval_natural
          output=$(mktemp -d)
          study="$archive/oecd_revisions_v1"
          python scripts/analyze_kam_oecd_revisions.py "$study/replay.json.gz" \
            --provenance "$study/provenance.json" --output "$output/oecd.json"
          diff -u "$study/summary.json" "$output/oecd.json"
          study="$archive/coverage_gate_v1"
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_coverage_gate.py "$study" --output "$output/gate.json"
          python - "$study/summary.json" "$output/gate.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          expected, replayed = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          assert expected["tests"] == replayed["tests"]
          PY
      - name: Replay matched revision controls
        run: |
          results=results/nonlinear_retrieval_natural
          output=$(mktemp -d)
          python scripts/analyze_kam_oecd_masks.py "$results/oecd_masks_v1/replay.json.gz" \
            --provenance "$results/oecd_revisions_v1/provenance.json" --output "$output/masks.json"
          diff -u "$results/oecd_masks_v1/summary.json" "$output/masks.json"
          python scripts/analyze_kam_archive_abstention.py "$results/oecd_abstention_v1/replay.json.gz" \
            --output "$output/abstention.json"
          diff -u "$results/oecd_abstention_v1/summary.json" "$output/abstention.json"
      - name: Replay sentence evidence and frozen reader
        run: |
          python -m pip install scipy==1.17.1
          export OPENBLAS_NUM_THREADS=1
          study=results/nonlinear_retrieval_natural/sentence_verifier_v1
          output=$(mktemp -d)
          python scripts/analyze_kam_sentence_verifier.py "$study/replay.json.gz" --output "$output/verifier.json"
          python - "$study/summary.json" "$output/verifier.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          expected, replayed = (json.loads(Path(p).read_text()) for p in sys.argv[1:])
          for key in ("tests", "clean_linked_shortlist_challenge", "linked_minus_sham", "feature_group_ablation",
                      "semantic_versus_frozen_link_interaction"):
              assert expected[key] == replayed[key], key
          PY
          python scripts/analyze_kam_verifier_followthrough.py "$study/followthrough_replay.json" \
            --output "$output/followthrough.json"
          diff -u "$study/followthrough.json" "$output/followthrough.json"
      - name: Replay the native Wikipedia sentence refit
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/native_sentence_refit_v1"
          old="$base/sentence_verifier_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_native_sentence_refit.py "$study/replay.json.gz" \
            --cohort-audit "$study/provenance.json" --old-policy "$old/policy.json" \
            --old-fit-replay "$old/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Replay the frozen-pool native routing gate
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/native_routing_gate_v1"
          output=$(mktemp)
          options=(--fixture "$study/fixture.json.gz" --pools "$study/pools.json.gz"
                   --fitted "$base/native_sentence_refit_v1/fitted.json" --output "$output")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_native_routing_gate.py analyze "$study/replay.json.gz" "${options[@]}"
          diff -u "$study/summary.json" "$output"
      - name: Replay sequential oracle headroom on frozen pools
        run: |
          base=results/nonlinear_retrieval_natural
          prior="$base/native_routing_gate_v1"
          study="$base/frozen_sequential_oracle_v1"
          output=$(mktemp)
          options=(--fixture "$prior/fixture.json.gz" --pools "$prior/pools.json.gz"
                   --broad-replay "$prior/replay.json.gz" --output "$output")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_frozen_sequential_oracle.py "$study/replay.json.gz" "${options[@]}"
          diff -u "$study/summary.json" "$output"
      - name: Check relative-lag compaction parity on CPU
        run: |
          for arm in dot_without_absolute radial_without_absolute; do
            python scripts/benchmark_kam_compacted_context.py --device cpu --arm "$arm" \
              --steps 2 --smoke --output "/tmp/kam-compaction-$arm.json"
          done
      - name: Replay conservative sequential fallback on fresh HotpotQA pools
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/sequential_fallback_v1"
          output=$(mktemp)
          options=(--fixture "$study/fixture.json.gz" --pools "$study/pools.json.gz"
                   --fitted "$base/native_sentence_refit_v1/fitted.json" --output "$output")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_sequential_fallback.py "$study/replay.json.gz" "${options[@]}"
          diff -u "$study/summary.json" "$output"
      - name: Replay conditioned full-corpus second-hop search
        run: |
          base=results/nonlinear_retrieval_natural
          prior="$base/sequential_fallback_v1"
          study="$base/conditioned_corpus_v1"
          output=$(mktemp)
          options=(--fixture "$prior/fixture.json.gz" --pools "$prior/pools.json.gz"
                   --reference "$prior/replay.json.gz" --output "$output")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_conditioned_corpus_search.py "$study/replay.json.gz" "${options[@]}"
          diff -u "$study/summary.json" "$output"
      - name: Replay conditioned union reranking
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/conditioned_union_v1"
          output=$(mktemp)
          options=(--fixture "$study/fixture.json.gz" --pools "$study/pools.json.gz"
                   --fitted "$base/native_sentence_refit_v1/fitted.json" --output "$output")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_conditioned_union.py "$study/replay.json.gz" "${options[@]}"
          diff -u "$study/summary.json" "$output"
      - name: Replay fixed-budget multi-anchor expansion
        run: |
          study=results/nonlinear_retrieval_natural/multi_anchor_expansion_v1
          output=$(mktemp)
          options=(--fixture "$study/fixture.json.gz" --pools "$study/pools.json.gz" --output "$output")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_multi_anchor_expansion.py "$study/replay.json.gz" "${options[@]}"
          diff -u "$study/summary.json" "$output"
      - name: Replay conditioned expansion guard
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/expansion_guard_v1"
          train="$base/sequential_fallback_v1"
          fitted="$base/native_sentence_refit_v1/fitted.json"
          policy=$(mktemp)
          output=$(mktemp)
          options=(--fixture "$train/fixture.json.gz" --pools "$train/pools.json.gz" --fitted "$fitted")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_expansion_guard.py lock "$study/training-replay.json.gz" "${options[@]}" --output "$policy"
          diff -u "$study/policy.json" "$policy"
          options=(--fixture "$study/fixture.json.gz" --pools "$study/pools.json.gz" --fitted "$fitted")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_expansion_guard.py evaluate "$study/replay.json.gz" "${options[@]}" --policy "$study/policy.json" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit exact union relation feature timings
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/union_relation_features_v1"
          union="$base/conditioned_union_v1"
          output=$(mktemp)
          options=(--fixture "$union/fixture.json.gz" --pools "$union/pools.json.gz" --replay "$union/replay.json.gz")
          python scripts/analyze_kam_union_relation_features.py "$study"/profile-?.json "${options[@]}" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Replay shared relation feature parity
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/shared_relation_v1"
          output=$(mktemp)
          python scripts/analyze_kam_shared_relation.py "$study/replay.json.gz" --reference "$base/expansion_guard_v1/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Replay broad-ranked anchor comparison
        run: |
          study=results/nonlinear_retrieval_natural/broad_anchor_v1
          output=$(mktemp)
          opts=(--affinity "$study/affinity-replay.json.gz" --fixture "$study/fixture.json.gz" --pools "$study/pools.json.gz")
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_broad_anchor.py "$study/replay.json.gz" "${opts[@]}" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit shared serving and article staging timings
        run: |
          base=results/nonlinear_retrieval_natural
          guard="$base/expansion_guard_v1"
          serving="$base/shared_serving_v1"
          output=$(mktemp)
          for prefix in "" "primed-"; do
            python scripts/analyze_kam_shared_serving.py "$serving/${prefix}replay.json.gz" --fixture "$guard/fixture.json.gz" --reference "$guard/replay.json.gz" --output "$output"
            diff -u "$serving/${prefix}summary.json" "$output"
          done
          staging="$base/article_staging_v1"
          python scripts/analyze_kam_article_staging.py "$staging"/staging-[01].json --pools "$guard/pools.json.gz" --reference "$guard/replay.json.gz" --output "$output"
          diff -u "$staging/summary.json" "$output"
      - name: Audit crossed article prewarm timing
        run: |
          base=results/nonlinear_retrieval_natural
          guard="$base/expansion_guard_v1"
          study="$base/article_prewarm_v1"
          output=$(mktemp)
          python scripts/analyze_kam_article_prewarm.py "$study"/prewarm-[01].json --pools "$guard/pools.json.gz" --reference "$guard/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit the gold-evidence reader replay
        run: |
          study=results/nonlinear_retrieval_natural/gold_reader_oracle_v1
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_gold_reader_oracle.py "$study/replay.json.gz" --fixture "$study/fixture.json.gz" --evidence "$study/gold-evidence.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit the fixed-pair sentence selection replay
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/reader_selection_v1"
          anchor="$base/broad_anchor_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_reader_sentence_selection.py "$study/replay.json.gz" --fixture "$anchor/fixture.json.gz" --reference "$anchor/replay.json.gz" --evidence "$study/gold-evidence.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit the fixed-pair reader document order replay
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/reader_order_v1"
          anchor="$base/broad_anchor_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_reader_order.py "$study/replay.json.gz" --fixture "$anchor/fixture.json.gz" --reference "$anchor/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit paired expansion replications
        run: |
          base=results/nonlinear_retrieval_natural
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_expansion_replications.py "$base" --output "$output"
          diff -u "$base/expansion_replications_v1/summary.json" "$output"
      - name: Audit the crossed B200 serving prewarm
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/shared_prewarm_serving_v1"
          guard="$base/expansion_guard_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_shared_prewarm_serving.py "$study"/serving-[01].json.gz --fixture "$guard/fixture.json.gz" --reference "$guard/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit the matched B200 dense and hybrid anchor replay
        run: |
          study=results/nonlinear_retrieval_natural/dense_hybrid_anchor_v1
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_dense_hybrid_anchor.py "$study" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit live B200 anchor timing
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/live_anchor_profile_v1"
          anchor="$base/broad_anchor_v1"
          output=$(mktemp)
          python scripts/analyze_kam_live_anchor_profile.py "$study"/profile-52953830-*.json.gz --fixture "$anchor/fixture.json.gz" --affinity "$anchor/affinity-replay.json.gz" --broad "$anchor/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit frozen IIRC routing transfer
        run: |
          study=results/nonlinear_retrieval_natural/iirc_pair_v1
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_iirc_pair.py "$study/replay.json.gz" --manifest "$study/manifest.json" --source-audit "$study/source-audit.json" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit live B200 sentence reuse
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/live_anchor_sentence_reuse_v1"
          anchor="$base/broad_anchor_v1"
          output=$(mktemp)
          python scripts/analyze_kam_live_anchor_profile.py "$study"/profile-52954950-*.json.gz --fixture "$anchor/fixture.json.gz" --broad "$anchor/replay.json.gz" --sentence-reuse --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit fixed-budget IIRC evidence visibility
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/iirc_visibility_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_iirc_visibility.py "$study/replay.json.gz" --manifest "$base/iirc_pair_v1/manifest.json" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit expansion stage failures and policy headroom
        run: |
          base=results/nonlinear_retrieval_natural
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_expansion_stage_headroom.py "$base/dense_hybrid_anchor_v1" --output "$output"
          diff -u "$base/expansion_stage_headroom_v1/summary.json" "$output"
      - name: Audit frozen IIRC reader with fixed article identities
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/iirc_reader_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_iirc_reader.py "$study/replay.json.gz" --visibility "$base/iirc_visibility_v1/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Refit IIRC pair heads and audit the locked held-out replay
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/iirc_pair_fit_v1"
          reference="$base/iirc_pair_v1/replay.json.gz"
          export OPENBLAS_NUM_THREADS=1
          output=$(mktemp -d)
          python scripts/fit_kam_iirc_pairs.py fit --train "$study/train-features.json.gz" --output "$output/fit.json"
          python scripts/fit_kam_iirc_pairs.py evaluate --dev "$study/dev-features.json.gz" --lock "$study/fit.json" --reference "$reference" --output "$output/summary.json"
          diff -u "$study/summary.json" "$output/summary.json"
          python scripts/fit_kam_iirc_pairs.py evaluate --dev "$study/dev-features.json.gz" --lock "$output/fit.json" --reference "$reference" --output "$output/refit-summary.json"
          python - "$study" "$output" <<'PY'
          import json
          from pathlib import Path
          import sys
          import numpy as np
          saved, replay = map(Path, sys.argv[1:])
          expected, actual = (json.loads((p / "fit.json").read_text()) for p in (saved, replay))
          for arm, values in expected["arms"].items():
              np.testing.assert_allclose(actual["arms"][arm]["coef"], values["coef"], rtol=2e-5, atol=2e-6)
          expected = json.loads((saved / "summary.json").read_text())
          refit = json.loads((replay / "refit-summary.json").read_text())
          for key in ("groups", "rows"):
              assert expected[key] == refit[key], key
          PY
      - name: Audit fixed-pool HotpotQA shortlist width
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/hybrid_shortlist_depth_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_hotpot_shortlist_depth.py "$study"/replay-52957284-*.json.gz --study "$base/dense_hybrid_anchor_v1" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Audit fixed-evidence IIRC answer formatting
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/iirc_reader_format_v1"
          output=$(mktemp)
          OPENBLAS_NUM_THREADS=1 python scripts/analyze_kam_iirc_reader_format.py --replay "$study/replay.json.gz" --reference "$base/iirc_reader_v1/replay.json.gz" --output "$output"
          diff -u "$study/summary.json" "$output"
      - name: Refit IIRC sequential heads and audit matched decisions
        run: |
          base=results/nonlinear_retrieval_natural
          study="$base/iirc_sequential_fit_v1"
          prior="$base/iirc_pair_fit_v1"
          export OPENBLAS_NUM_THREADS=1
          output=$(mktemp -d)
          python scripts/fit_kam_iirc_sequential.py fit --train "$prior/train-features.json.gz" --joint-fit "$prior/fit.json" --output "$output/fit.json"
          python scripts/fit_kam_iirc_sequential.py evaluate --dev "$prior/dev-features.json.gz" --conditional-fit "$study/fit.json" --joint-fit "$prior/fit.json" --reference "$prior/summary.json" --output "$output/summary.json"
          diff -u "$study/summary.json" "$output/summary.json"
          python scripts/fit_kam_iirc_sequential.py evaluate --dev "$prior/dev-features.json.gz" --conditional-fit "$output/fit.json" --joint-fit "$prior/fit.json" --reference "$prior/summary.json" --output "$output/refit.json"
          python - "$study" "$output" <<'PY'
          import json
          from pathlib import Path
          import sys
          import numpy as np
          saved, replay = map(Path, sys.argv[1:])
          expected, actual = (json.loads((p / "fit.json").read_text()) for p in (saved, replay))
          for arm, values in expected["models"].items():
              np.testing.assert_allclose(actual["models"][arm]["coef"], values["coef"], rtol=2e-5, atol=2e-6)
          expected = json.loads((saved / "summary.json").read_text())
          refit = json.loads((replay / "refit.json").read_text())
          for key in ("cohorts", "rows"):
              assert expected[key] == refit[key], key
          PY
